const DOMAINS = {"prep": {"color": "var(--brand-orange)", "fr": "Préparer les données", "en": "Prepare the data"}, "model": {"color": "var(--data-blue)", "fr": "Modéliser les données", "en": "Model the data"}, "viz": {"color": "var(--accent-dark)", "fr": "Visualiser et analyser", "en": "Visualize and analyze"}, "manage": {"color": "var(--bg-dark-2)", "fr": "Gérer et sécuriser Power BI", "en": "Manage and secure Power BI"}};
const DOMAIN_KEYS = ['prep','model','viz','manage'];
const DOMAIN_TARGETS = {"prep": 12, "model": 10, "viz": 10, "manage": 8};

let lang = 'fr';
function t(key){ const s = STRINGS[key]; return s ? s[lang] : key; }
function tf(key, vals){
  let s = t(key);
  Object.keys(vals||{}).forEach(k=>{ s = s.split('{'+k+'}').join(vals[k]); });
  return s;
}
function bi(field){ return field ? field[lang] : ''; }

let QUESTIONS = [];

/* =========================================================
   0. TIRAGE ALÉATOIRE DE L'EXAMEN (40 questions sur 120)
   ========================================================= */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildExam(){
  const scenarioIds = Object.keys(SCENARIOS);
  const chosen = shuffleArr(scenarioIds).slice(0, 2); // [lead, embedded]
  const leadId = chosen[0], embeddedId = chosen[1];
  const leadQs = QUESTION_BANK.filter(q=>q.scenario===leadId);
  const embeddedQs = QUESTION_BANK.filter(q=>q.scenario===embeddedId);
  const standalone = QUESTION_BANK.filter(q=>!q.scenario);

  // Compte des questions de mises en situation par domaine, pour ajuster les cibles restantes
  const used = {}; DOMAIN_KEYS.forEach(k=>used[k]=0);
  leadQs.concat(embeddedQs).forEach(q=> used[q.domain]++);

  const byDomain = {}; DOMAIN_KEYS.forEach(k=> byDomain[k] = shuffleArr(standalone.filter(q=>q.domain===k)));
  const pickedStandalone = [];
  const pickedSet = new Set();
  DOMAIN_KEYS.forEach(k=>{
    const remaining = Math.max(0, DOMAIN_TARGETS[k] - used[k]);
    byDomain[k].slice(0, remaining).forEach(q=>{ pickedStandalone.push(q); pickedSet.add(q); });
  });
  // Complète jusqu'à 34 questions autonomes si l'arrondi laisse un manque
  const targetStandalone = 40 - 6;
  if(pickedStandalone.length < targetStandalone){
    const pool = shuffleArr(standalone.filter(q=>!pickedSet.has(q)));
    for(const q of pool){
      if(pickedStandalone.length >= targetStandalone) break;
      pickedStandalone.push(q); pickedSet.add(q);
    }
  }
  const restShuffled = shuffleArr(pickedStandalone.slice(0, targetStandalone));
  // Insère le bloc de la mise en situation "embarquée" à une position aléatoire dans le reste
  const insertAt = Math.floor(Math.random() * (restShuffled.length + 1));
  const rest = restShuffled.slice(0, insertAt).concat(embeddedQs).concat(restShuffled.slice(insertAt));

  QUESTIONS = leadQs.concat(rest);
}

let matchDisplayOrder = {}; // qIdx -> {items:[origIdx...], targets:[origIdx...]} ordre d'affichage mélangé,
                            // calculé une seule fois par question pour ne pas coïncider avec l'ordre des données
                            // (sinon "1er élément -> 1ère catégorie" devient une astuce de position, sans lire l'énoncé).
function getMatchOrder(qIdx, q){
  if(!matchDisplayOrder[qIdx]){
    matchDisplayOrder[qIdx] = {
      items: shuffleArr(q.items.map(function(_,idx){ return idx; })),
      targets: shuffleArr(q.targets.map(function(_,idx){ return idx; })),
    };
  }
  return matchDisplayOrder[qIdx];
}

function renderPalette(){
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = QUESTIONS.map(function(q,i){
    let cls = 'pal-btn';
    if(isQuestionAnswered(i)) cls += ' answered';

    if(state.flagged.has(i)) cls += ' flagged';

    return '<button type="button" class="' + cls + '" data-idx="' + i + '" ' + ((state.finished || locked)?'disabled':'') + '>' + (i+1) + '</button>';
  }).join('');
  grid.querySelectorAll('.pal-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ gotoQuestion(parseInt(btn.dataset.idx)); });
  });
}
function gotoQuestion(idx){
  state.reviewScreen = false;
  state.current = idx;
  renderQuestion();
  renderPalette();
}

/* =========================================================
   4. INTERACTIONS PAR TYPE DE QUESTION
   ========================================================= */
function selectSingle(qIdx, optIdx){
  if(state.finished) return;
  state.answers[qIdx] = optIdx;
  renderQuestion(); renderPalette();
}
function toggleMulti(qIdx, optIdx){
  if(state.finished) return;
  const cur = Array.isArray(state.answers[qIdx]) ? state.answers[qIdx].slice() : [];
  const pos = cur.indexOf(optIdx);
  if(pos>=0) cur.splice(pos,1); else cur.push(optIdx);
  state.answers[qIdx] = cur;
  renderQuestion(); renderPalette();
}
function moveOrderItem(qIdx, fromPos, toPos){
  if(state.finished) return;
  const q = QUESTIONS[qIdx];
  const arr = (state.answers[qIdx] || q.shuffle).slice();
  if(toPos<0 || toPos>=arr.length) return;
  const moved = arr.splice(fromPos, 1)[0];
  arr.splice(toPos, 0, moved);
  state.answers[qIdx] = arr;
  renderQuestion(); renderPalette();
}
function assignMatch(qIdx, itemIdx, targetIdx){
  if(state.finished) return;
  const q = QUESTIONS[qIdx];
  const arr = (state.answers[qIdx] || new Array(q.items.length).fill(-1)).slice();
  const prevOccupant = arr.findIndex(function(v){ return v===targetIdx; });
  if(prevOccupant>=0) arr[prevOccupant] = -1;
  arr[itemIdx] = targetIdx;
  state.answers[qIdx] = arr;
  delete matchArmed[qIdx];
  renderQuestion(); renderPalette();
}
function unassignMatch(qIdx, itemIdx){
  if(state.finished) return;
  const q = QUESTIONS[qIdx];
  const arr = (state.answers[qIdx] || new Array(q.items.length).fill(-1)).slice();
  arr[itemIdx] = -1;
  state.answers[qIdx] = arr;
  renderQuestion(); renderPalette();
}
function armMatchItem(qIdx, itemIdx){
  if(state.finished) return;
  matchArmed[qIdx] = (matchArmed[qIdx]===itemIdx) ? undefined : itemIdx;
  renderQuestion();
}
function setFillValue(qIdx, blankIdx, value){
  if(state.finished) return;
  const q = QUESTIONS[qIdx];
  const arr = (state.answers[qIdx] || new Array(q.blanks.length).fill('')).slice();
  arr[blankIdx] = value;
  state.answers[qIdx] = arr;
  renderPalette();
}
function toggleFlag(qIdx){
  if(state.flagged.has(qIdx)) state.flagged.delete(qIdx); else state.flagged.add(qIdx);
  renderQuestion(); renderPalette();
}
function toggleHint(qIdx){
  if(state.hintOpen.has(qIdx)) state.hintOpen.delete(qIdx);
  else { state.hintOpen.add(qIdx); state.helped.add(qIdx); }
  renderQuestion(); renderPalette();
}
function toggleSol(qIdx){
  if(state.solOpen.has(qIdx)) state.solOpen.delete(qIdx);
  else { state.solOpen.add(qIdx); state.helped.add(qIdx); }
  renderQuestion(); renderPalette();
}

/* =========================================================
   5. FORMATAGE DES REPONSES (commun a tous les types)
   ========================================================= */
const OPT_LETTERS = ['A','B','C','D','E'];
function normFill(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function fillTemplateHtml(q, values, isCorrectDisplay){
  const tpl = bi(q.template);
  return tpl.replace(/___(\d+)___/g, function(m, n){
    const idx = parseInt(n) - 1;
    const val = isCorrectDisplay ? q.blanks[idx].display : (values && values[idx] ? values[idx] : '...');
    return '<b>' + val + '</b>';
  });
}
function isQuestionAnswered(i){
  const q = QUESTIONS[i];
  const a = state.answers[i];
  if(q.type==='order') return true;
  if(a===undefined) return false;
  if(q.type==='multi') return Array.isArray(a) && a.length>0;
  if(q.type==='match') return Array.isArray(a) && a.every(function(v){ return v!==-1; });
  if(q.type==='fill') return Array.isArray(a) && a.every(function(v){ return normFill(v).length>0; });
  return true;
}
function formatAnswer(q, given){
  if(q.type==='single'){
    return (given===undefined) ? t('noAnswer') : OPT_LETTERS[given]+'. '+bi(q.options[given]);
  }
  if(q.type==='multi'){
    return (!given || given.length===0) ? t('noAnswer') : given.map(function(x){ return OPT_LETTERS[x]+'. '+bi(q.options[x]); }).join(' | ');
  }
  if(q.type==='order'){
    const arr = given || q.shuffle;
    return arr.map(function(origIdx,pos){ return (pos+1)+') '+bi(q.items[origIdx]); }).join('  ->  ');
  }
  if(q.type==='match'){
    const arr = given || new Array(q.items.length).fill(-1);
    return q.items.map(function(it,idx){ return bi(it)+' -> '+(arr[idx]===-1 ? t('notAssigned') : bi(q.targets[arr[idx]])); }).join(' | ');
  }
  if(q.type==='fill'){
    return fillTemplateHtml(q, given, false);
  }
  return t('noAnswer');
}
function formatCorrectAnswer(q){
  if(q.type==='single') return OPT_LETTERS[q.correct]+'. '+bi(q.options[q.correct]);
  if(q.type==='multi') return q.correct.map(function(x){ return OPT_LETTERS[x]+'. '+bi(q.options[x]); }).join(' | ');
  if(q.type==='order') return q.items.map(function(it,idx){ return (idx+1)+') '+bi(it); }).join('  ->  ');
  if(q.type==='match') return q.items.map(function(it,idx){ return bi(it)+' -> '+bi(q.targets[q.correct[idx]]); }).join(' | ');
  if(q.type==='fill') return fillTemplateHtml(q, null, true);
  return '';
}
function isCorrect(q, given){
  if(q.type==='order' && given===undefined) given = q.shuffle;
  if(given===undefined) return false;
  if(q.type==='multi'){
    const g = Array.isArray(given) ? given.slice().sort() : [];
    const c = q.correct.slice().sort();
    return g.length===c.length && g.every(function(v,idx){ return v===c[idx]; });
  }
  if(q.type==='order'){
    return Array.isArray(given) && given.length===q.items.length && given.every(function(v,idx){ return v===idx; });
  }
  if(q.type==='match'){
    return Array.isArray(given) && q.correct.every(function(c,idx){ return given[idx]===c; });
  }
  if(q.type==='fill'){
    if(!Array.isArray(given)) return false;
    return q.blanks.every(function(b,idx){ return b.accept.includes(normFill(given[idx])); });
  }
  return given === q.correct;
}

/* =========================================================
   6. CARTE QUESTION
   ========================================================= */
function renderQuestion(){
  if(state.reviewScreen){ renderReviewScreen(); return; }
  const i = state.current;
  const q = QUESTIONS[i];
  const d = DOMAINS[q.domain];
  document.getElementById('examProgress').textContent = t('questionOf') + ' ' + (i+1) + ' / ' + QUESTIONS.length;

  let scenarioHtml = '';
  if(q.scenario){
    const sc = SCENARIOS[q.scenario];
    scenarioHtml = '<div class="scenario-box"><div class="sc-title">\uD83D\uDDC2 ' + bi(sc.title) + '</div>' + bi(sc.text) + '</div>';
  }

  const isMulti = q.type === 'multi';
  const shape = isMulti ? 'square' : 'round';
  const selected = state.answers[i];

  let instrText = t('instrSingle');
  if(q.type==='multi') instrText = t('instrMulti');
  else if(q.type==='order') instrText = t('instrOrder');
  else if(q.type==='match') instrText = t('instrMatch');
  else if(q.type==='fill') instrText = t('instrFill');

  let bodyHtml = '';
  if(q.type==='single' || q.type==='multi'){
    bodyHtml = '<div class="q-options">' + q.options.map(function(optText, oi){
      const isSel = isMulti ? (Array.isArray(selected) && selected.includes(oi)) : (selected===oi);
      return '<button type="button" class="opt-btn ' + (isSel?'sel':'') + '" data-shape="' + shape + '" data-opt="' + oi + '">' +
        '<span class="opt-mark">' + (isSel ? (isMulti?'\u2713':'\u25CF') : OPT_LETTERS[oi]) + '</span>' +
        '<span>' + bi(optText) + '</span></button>';
    }).join('') + '</div>';
  } else if(q.type==='order'){
    const arr = selected || q.shuffle;
    bodyHtml = '<div class="order-list" id="orderList">' + arr.map(function(origIdx,pos){
      return '<div class="order-item" draggable="true" data-pos="' + pos + '">' +
        '<span class="order-num">' + (pos+1) + '</span>' +
        '<span class="order-text">' + bi(q.items[origIdx]) + '</span>' +
        '<span class="order-controls">' +
          '<button type="button" class="order-btn" data-dir="up" data-pos="' + pos + '" ' + (pos===0?'disabled':'') + '>\u25B2</button>' +
          '<button type="button" class="order-btn" data-dir="down" data-pos="' + pos + '" ' + (pos===arr.length-1?'disabled':'') + '>\u25BC</button>' +
        '</span></div>';
    }).join('') + '</div>';
  } else if(q.type==='match'){
    const arr = selected || new Array(q.items.length).fill(-1);
    const armed = matchArmed[i];
    const order = getMatchOrder(i, q);
    const poolHtml = order.items.map(function(idx){
      const it = q.items[idx];
      return arr[idx]!==-1 ? '' : '<div class="match-chip ' + (armed===idx?'armed':'') + '" draggable="true" data-item="' + idx + '">' + bi(it) + '</div>';
    }).join('');
    const poolEmpty = q.items.every(function(_,idx){return arr[idx]!==-1;}) ? '<div class="match-pool-empty">\u2713</div>' : '';
    const targetsHtml = order.targets.map(function(tIdx){
      const label = q.targets[tIdx];
      const occ = arr.findIndex(function(v){ return v===tIdx; });
      const inner = occ>=0
        ? '<div class="match-chip placed" draggable="true" data-item="' + occ + '">' + bi(q.items[occ]) + '<span class="match-remove" data-item="' + occ + '">\u2715</span></div>'
        : '<div class="match-empty" data-target="' + tIdx + '">...</div>';
      return '<div class="match-target" data-target="' + tIdx + '"><div class="match-target-label">' + bi(label) + '</div>' + inner + '</div>';
    }).join('');
    bodyHtml = '<div class="match-wrap" id="matchWrap"><div><div class="match-pool">' + poolHtml + poolEmpty + '</div></div>' +
      '<div><div class="match-targets">' + targetsHtml + '</div></div></div>';
  } else if(q.type==='fill'){
    const given = selected || new Array(q.blanks.length).fill('');
    const tpl = bi(q.template);
    const html = tpl.replace(/___(\d+)___/g, function(m, n){
      const idx = parseInt(n) - 1;
      const val = (given[idx]||'').replace(/"/g,'&quot;');
      return '<input type="text" class="fill-input" data-blank="' + idx + '" value="' + val + '" autocomplete="off" spellcheck="false">';
    });
    bodyHtml = '<div class="fill-wrap"><div class="fill-template">' + html + '</div></div>';
  }

  const helpHtml = state.finished ? '' :
    '<div class="help-row">' +
      '<button type="button" class="ghost" id="btnHint">' + (state.hintOpen.has(i) ? t('hintBtnHide') : t('hintBtn')) + '</button>' +
      '<button type="button" class="ghost" id="btnSol">' + (state.solOpen.has(i) ? t('solBtnHide') : t('solBtn')) + '</button>' +
    '</div>' +
    (state.hintOpen.has(i) ? '<div class="help-box hint">\uD83D\uDCA1 ' + bi(q.hint) + '</div>' : '') +
    (state.solOpen.has(i) ? '<div class="help-box sol">\u2705 ' + t('goodAnswer') + ' : ' + formatCorrectAnswer(q) + '<br>' + bi(q.explain) + '</div>' : '') +
    (state.helped.has(i) ? '<div class="aided-note">' + t('aidedNote') + '</div>' : '');

  const isLastOfLeadSection = (i === CASE_STUDY_LEAD_COUNT - 1) && !state.caseStudyDone;
  const isLastQuestion = (i === QUESTIONS.length - 1) && !isLastOfLeadSection && !state.finished;
  const nextLabel = isLastOfLeadSection ? t('btnFinishSection') : (isLastQuestion ? t('btnFinishExam') : t('btnNext'));
  const nextDisabled = state.finished && i===QUESTIONS.length-1;

  const card = document.getElementById('qcard');
  card.innerHTML =
    '<div class="q-eyebrow">' +
      '<span class="q-domain-tag" style="background:' + d.color + ';">' + d[lang] + '</span>' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
        '<span class="q-num">' + t('questionOf') + ' ' + (i+1) + ' / ' + QUESTIONS.length + '</span>' +
        '<button type="button" class="ghost ' + (state.flagged.has(i)?'flagged':'') + '" id="btnFlag">' + (state.flagged.has(i) ? t('flagBtnOn') : t('flagBtnOff')) + '</button>' +
      '</div></div>' +
    scenarioHtml +
    '<div class="q-prompt">' + bi(q.prompt) + '</div>' +
    '<div class="q-instr">' + instrText + '</div>' +
    bodyHtml + helpHtml +
    '<div class="exam-reminder">' + t('examReminder') + '</div>' +
    '<div class="q-nav">' +
      '<div class="q-nav-left"><button type="button" class="secondary" id="btnPrev" ' + (i===0?'disabled':'') + '>' + t('btnPrev') + '</button></div>' +
      '<div class="q-nav-right"><button type="button" class="' + (isLastQuestion?'primary':'secondary') + '" id="btnNext" ' + (nextDisabled?'disabled':'') + '>' + nextLabel + '</button></div>' +
    '</div>';

  if(q.type==='single' || q.type==='multi'){
    card.querySelectorAll('.opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const oi = parseInt(btn.dataset.opt);
        if(isMulti) toggleMulti(i, oi); else selectSingle(i, oi);
      });
    });
  } else if(q.type==='order'){
    const list = document.getElementById('orderList');
    list.querySelectorAll('.order-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const pos = parseInt(btn.dataset.pos);
        const dir = btn.dataset.dir==='up' ? -1 : 1;
        moveOrderItem(i, pos, pos+dir);
      });
    });
    let dragPos = null;
    list.querySelectorAll('.order-item').forEach(function(el){
      el.addEventListener('dragstart', function(){ dragPos = parseInt(el.dataset.pos); });
      el.addEventListener('dragover', function(e){ e.preventDefault(); el.classList.add('dragover'); });
      el.addEventListener('dragleave', function(){ el.classList.remove('dragover'); });
      el.addEventListener('drop', function(e){
        e.preventDefault(); el.classList.remove('dragover');
        const toPos = parseInt(el.dataset.pos);
        if(dragPos!==null && dragPos!==toPos) moveOrderItem(i, dragPos, toPos);
        dragPos = null;
      });
    });
  } else if(q.type==='match'){
    const wrap = document.getElementById('matchWrap');
    let dragItem = null;
    wrap.querySelectorAll('.match-chip:not(.placed)').forEach(function(chip){
      chip.addEventListener('click', function(){ armMatchItem(i, parseInt(chip.dataset.item)); });
      chip.addEventListener('dragstart', function(){ dragItem = parseInt(chip.dataset.item); });
    });
    wrap.querySelectorAll('.match-chip.placed').forEach(function(chip){
      chip.addEventListener('dragstart', function(){ dragItem = parseInt(chip.dataset.item); });
    });
    wrap.querySelectorAll('.match-remove').forEach(function(btn){
      btn.addEventListener('click', function(e){ e.stopPropagation(); unassignMatch(i, parseInt(btn.dataset.item)); });
    });
    wrap.querySelectorAll('.match-target').forEach(function(zone){
      zone.addEventListener('click', function(){
        const tIdx = parseInt(zone.dataset.target);
        if(matchArmed[i]!==undefined) assignMatch(i, matchArmed[i], tIdx);
      });
      zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', function(){ zone.classList.remove('dragover'); });
      zone.addEventListener('drop', function(e){
        e.preventDefault(); zone.classList.remove('dragover');
        const tIdx = parseInt(zone.dataset.target);
        if(dragItem!==null) assignMatch(i, dragItem, tIdx);
        dragItem = null;
      });
    });
  } else if(q.type==='fill'){
    card.querySelectorAll('.fill-input').forEach(function(inp){
      inp.addEventListener('input', function(){ setFillValue(i, parseInt(inp.dataset.blank), inp.value); });
    });
  }

  document.getElementById('btnFlag').addEventListener('click', function(){ toggleFlag(i); });
  const btnHint = document.getElementById('btnHint');
  const btnSol = document.getElementById('btnSol');
  if(btnHint) btnHint.addEventListener('click', function(){ toggleHint(i); });
  if(btnSol) btnSol.addEventListener('click', function(){ toggleSol(i); });
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  if(btnPrev) btnPrev.addEventListener('click', function(){ if(state.current>0){ gotoQuestion(state.current-1); } });
  if(btnNext) btnNext.addEventListener('click', function(){
    if(isLastOfLeadSection){ state.reviewScreen = true; renderQuestion(); renderPalette(); }
    else if(isLastQuestion){ requestFinishExam(); }
    else if(state.current<QUESTIONS.length-1){ gotoQuestion(state.current+1); }
  });

  if(state.finished){
    card.querySelectorAll('.opt-btn, .order-btn, .match-chip, .match-target, .match-remove, .fill-input').forEach(function(b){
      b.style.pointerEvents='none'; if(b.tagName==='INPUT') b.disabled = true;
    });
  }
}

/* =========================================================
   6bis. ECRAN DE REVISION DE LA MISE EN SITUATION D'OUVERTURE
   ========================================================= */
function renderReviewScreen(){
  document.getElementById('examProgress').textContent = t('reviewTitle');
  const leadId = QUESTIONS[0].scenario;
  const sc = SCENARIOS[leadId];
  let unanswered = 0;

  const itemsHtml = Array.from({length: CASE_STUDY_LEAD_COUNT}, function(_,i){return i;}).map(function(i){
    const q = QUESTIONS[i];
    const d = DOMAINS[q.domain];
    const given = state.answers[i];
    if(!isQuestionAnswered(i)) unanswered++;
    return '<div class="review-q-item"><div class="rq-head">' +
      '<span class="q-domain-tag" style="background:' + d.color + ';">' + d[lang] + '</span>' +
      '<button type="button" class="ghost" data-goto="' + i + '">' + t('reviewEdit') + '</button></div>' +
      '<div class="rq-prompt">' + t('questionOf') + ' ' + (i+1) + ' \u2014 ' + bi(q.prompt) + '</div>' +
      '<div class="rq-answer">' + t('reviewYourAnswer') + ' : ' + formatAnswer(q, given) + '</div></div>';
  }).join('');

  const warningHtml = unanswered>0 ? '<div class="review-warning">' + tf('reviewWarning',{n:unanswered}) + '</div>' : '';

  const card = document.getElementById('qcard');
  card.innerHTML =
    '<div class="q-eyebrow"><span class="q-domain-tag" style="background:var(--data-blue);">' + t('reviewTitle') + '</span></div>' +
    '<div class="scenario-box"><div class="sc-title">\uD83D\uDDC2 ' + bi(sc.title) + '</div>' + bi(sc.text) + '</div>' +
    '<div class="review-intro">' + tf('reviewIntro',{n:CASE_STUDY_LEAD_COUNT}) + '</div>' +
    warningHtml + itemsHtml +
    '<div class="q-nav"><div class="q-nav-left"></div><div class="q-nav-right"><button type="button" class="primary" id="btnValidateSection">' + t('btnValidateSection') + '</button></div></div>';

  card.querySelectorAll('[data-goto]').forEach(function(btn){
    btn.addEventListener('click', function(){ gotoQuestion(parseInt(btn.dataset.goto)); });
  });
  document.getElementById('btnValidateSection').addEventListener('click', function(){
    state.caseStudyDone = true; state.reviewScreen = false; state.current = CASE_STUDY_LEAD_COUNT;
    renderQuestion(); renderPalette();
  });
}

/* =========================================================
   7. CHRONOMETRE
   ========================================================= */
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function updateTimerDisplay(){
  const el = document.getElementById('examTimer');
  const wrap = document.getElementById('headerTimerWrap');
  el.textContent = formatTime(state.remaining);
  wrap.classList.toggle('low', state.remaining <= 5*60);
}
function updateHeaderSwitchesBadge(){
  const badge = document.getElementById('headerSwitches');
  if(state.tabSwitches > 0){
    badge.style.display = 'inline';
    badge.textContent = '\u00B7 \u26A0 ' + state.tabSwitches;
  } else {
    badge.style.display = 'none';
  }
}
function startTimer(){
  if(state.started || state.finished) return;
  state.started = true;
  document.getElementById('headerTimerWrap').style.display = 'inline-flex';
  state.timerHandle = setInterval(function(){
    state.remaining -= 1; state.timeUsed += 1;
    if(state.remaining <= 0){ state.remaining = 0; updateTimerDisplay(); finishExam(true); return; }
    updateTimerDisplay();
  }, 1000);
  updateTimerDisplay();
}

/* =========================================================
   7bis. DETECTION DE CHANGEMENT DE FENETRE / ONGLET / ECRAN
   Combine la Page Visibility API (changement d'onglet) et les evenements
   window blur/focus (perte de focus de la fenetre, y compris vers une
   fenetre situee sur un second ecran). Signal informatif, pas un vrai
   controle anti-fraude : on ne peut detecter que la perte de focus.
   ========================================================= */
let tabSwitchAlertTimeout = null;
let switchCooldown = false;
function showTabSwitchAlert(){
  const el = document.getElementById('tabSwitchAlert');
  const txt = document.getElementById('tabSwitchAlertText');
  if(!el || !txt) return;
  txt.textContent = tf('tabSwitchNote', {n: state.tabSwitches}).replace(/^ . /, '');
  el.classList.add('show');
  clearTimeout(tabSwitchAlertTimeout);
  tabSwitchAlertTimeout = setTimeout(function(){ el.classList.remove('show'); }, 15000);
}
function registerSwitch(){
  if(!state.started || state.finished || state.suppressSwitchDetection) return;
  if(switchCooldown) return;
  switchCooldown = true;
  setTimeout(function(){ switchCooldown = false; }, 400);
  state.tabSwitches += 1;
  updateHeaderSwitchesBadge();
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ registerSwitch(); }
  else if(state.tabSwitches > 0 && state.started && !state.finished){ showTabSwitchAlert(); }
});
window.addEventListener('blur', function(){ registerSwitch(); });
window.addEventListener('focus', function(){
  if(state.tabSwitches > 0 && state.started && !state.finished){ showTabSwitchAlert(); }
});
document.getElementById('tabSwitchAlertClose').addEventListener('click', function(){
  clearTimeout(tabSwitchAlertTimeout);
  document.getElementById('tabSwitchAlert').classList.remove('show');
});

/* =========================================================
   8. TERMINER L'EXAMEN
   ========================================================= */
function countUnanswered(){
  let n = 0;
  QUESTIONS.forEach(function(q,i){ if(!isQuestionAnswered(i)) n++; });
  return n;
}
function requestFinishExam(){
  if(state.finished) return;
  const unanswered = countUnanswered();
  const box = document.getElementById('finishConfirm');
  if(unanswered>0 && !state.finishConfirmPending){
    state.finishConfirmPending = true;
    document.getElementById('finishConfirmText').textContent = tf('finishConfirmText', {n: unanswered});
    box.classList.add('show');
    return;
  }
  finishExam(false);
}
document.getElementById('btnFinishExam').addEventListener('click', requestFinishExam);
document.getElementById('btnFinishConfirmYes').addEventListener('click', function(){ finishExam(false); });
document.getElementById('btnFinishConfirmNo').addEventListener('click', function(){
  state.finishConfirmPending = false;
  document.getElementById('finishConfirm').classList.remove('show');
});

function finishExam(timeUp){
  if(state.finished) return;
  state.finished = true;
  state.reviewScreen = false;
  state.timeUpFlag = !!timeUp;
  if(state.timerHandle) clearInterval(state.timerHandle);
  document.getElementById('headerTimerWrap').style.display = 'none';
  document.getElementById('finishConfirm').classList.remove('show');
  document.getElementById('btnFinishExam').disabled = true;

/* =========================================================
   10. RECAP
   ========================================================= */
function renderRecap(timeUp){
  let correctCount = 0;
  const domainStats = {}; DOMAIN_KEYS.forEach(function(k){ domainStats[k] = {correct:0, total:0}; });

  const qRows = QUESTIONS.map(function(q,i){
    const given = state.answers[i];
    const rawOk = isCorrect(q, given);
    const aided = state.helped.has(i);
    const scored = rawOk && !aided;
    domainStats[q.domain].total++;
    if(scored){ correctCount++; domainStats[q.domain].correct++; }

    const givenLabel = formatAnswer(q, given);
    const correctLabel = formatCorrectAnswer(q);
    const d = DOMAINS[q.domain];
    const scenarioLine = q.scenario ? '<div class="recap-scenario">\uD83D\uDDC2 ' + bi(SCENARIOS[q.scenario].title) + '</div>' : '';
    const rowClass = aided ? 'wrong' : (rawOk ? 'right' : 'wrong');
    const markLabel = aided ? (t('aidedLabelShort') + (rawOk ? t('aidedButRight') : '')) : (rawOk ? t('correctLabelShort') : t('incorrectLabelShort'));
    const markClass = aided ? 'ko' : (rawOk ? 'ok' : 'ko');

    return '<div class="recap-q ' + rowClass + '"><div class="recap-q-head">' +
      '<span class="q-domain-tag" style="background:' + d.color + ';">' + d[lang] + '</span>' +
      '<span class="recap-q-mark ' + markClass + '">' + markLabel + ' \u2014 ' + t('questionOf') + ' ' + (i+1) + '</span></div>' +
      scenarioLine +
      '<div class="recap-prompt">' + bi(q.prompt) + '</div>' +
      '<div class="recap-answers"><div class="ra-you">' + t('yourAnswerLabel') + ' : ' + givenLabel + '</div>' +
      ((rawOk && !aided) ? '' : '<div class="ra-correct">' + t('goodAnswer') + ' : ' + correctLabel + '</div>') + '</div>' +
      '<div class="recap-explain">\uD83D\uDCA1 ' + bi(q.explain) + '</div>' +
      '<div class="recap-link"><a href="' + questionLink(q) + '" target="_blank" rel="noopener noreferrer">' + t('learnMoreRecap') + '</a></div>' +
      '</div>';
  }).join('');

  const total = QUESTIONS.length;
  const pct = Math.round((correctCount/total)*100);
  const scaled = Math.round((correctCount/total)*1000);
  const passed = pct >= 70;

  let msg = '';
  if(pct>=85) msg = t('msgExcellent');
  else if(pct>=70) msg = t('msgPass');
  else if(pct>=50) msg = t('msgMid');
  else msg = t('msgLow');
  if(timeUp) msg = t('msgTimeUp') + msg;

  const domainCards = DOMAIN_KEYS.map(function(k){
    const d = DOMAINS[k]; const s = domainStats[k];
    const dpct = s.total ? Math.round((s.correct/s.total)*100) : 0;
    return '<div class="ds-card"><div class="ds-label">' + d[lang] + '</div>' +
      '<div class="ds-bar-track"><div class="ds-bar-fill" style="width:' + dpct + '%; background:' + d.color + ';"></div></div>' +
      '<div class="ds-nb">' + s.correct + ' / ' + s.total + ' (' + dpct + '%)</div></div>';
  }).join('');

  const now = new Date();
  const dateStr = now.toLocaleDateString(lang==='fr' ? 'fr-FR' : 'en-US', {year:'numeric', month:'long', day:'numeric'});
  const certHtml = passed ? renderCertificate(document.getElementById('recapNom') ? document.getElementById('recapNom').value : '', pct, dateStr) : '';

  const wrap = document.getElementById('recapWrap');
  wrap.innerHTML =
    '<div class="recap-session no-print">' +
      '<div class="recap-field"><label>' + t('yourName') + '</label><input type="text" id="recapNom" placeholder="' + t('yourNamePlaceholder') + '"></div>' +
      '<div class="recap-field"><label>' + t('dateLabel') + '</label><input type="text" id="recapDate" value="' + dateStr + '"></div>' +
    '</div>' +
    '<div class="score-banner"><div><div class="sb-big">' + correctCount + ' / ' + total + '</div><div class="sb-lbl">' + t('scoreLabel') + ' (' + pct + '%)</div></div>' +
      '<span class="sb-pass ' + (passed?'ok':'ko') + '">' + (passed?t('thresholdOk'):t('thresholdKo')) + '</span>' +
      '<div class="sb-msg">' + msg + '<div class="sb-time" style="margin-top:6px;">' + tf('scaledScore',{scaled:scaled, time:formatTime(state.timeUsed)}) + (state.tabSwitches>0 ? tf('tabSwitchNote',{n:state.tabSwitches}) : '') + '</div></div></div>' +
    '<div class="domain-scores">' + domainCards + '</div>' +
    '<div id="certSlot">' + certHtml + '</div>' +
    '<div class="recap-actions no-print"><button class="primary" id="btnPrintRecap">' + t('btnPrint') + '</button>' +
    '<button class="secondary" id="btnRestartExam">' + t('btnRestart') + '</button></div>' +
    qRows;

  const nameInput = document.getElementById('recapNom');
  if(nameInput) nameInput.addEventListener('input', function(){
    if(passed) document.getElementById('certSlot').innerHTML = renderCertificate(nameInput.value, pct, dateStr);
  });
  document.getElementById('btnPrintRecap').addEventListener('click', function(){
    state.suppressSwitchDetection = true;
    window.print();
    setTimeout(function(){ state.suppressSwitchDetection = false; }, 1200);
  });
  document.getElementById('btnRestartExam').addEventListener('click', restartExam);
}

function restartExam(){
  if(state.timerHandle) clearInterval(state.timerHandle);
  matchArmed = {};
  matchDisplayOrder = {};
  buildExam();
  state = {
    current:0, answers:{}, flagged:new Set(), helped:new Set(), hintOpen:new Set(), solOpen:new Set(),
    caseStudyDone:false, reviewScreen:false, tabSwitches:0,
    started:false, finished:false,
    remaining:EXAM_DURATION_SEC, timeUsed:0, timerHandle:null, finishConfirmPending:false, suppressSwitchDetection:false,
    timeUpFlag:false,
  };
  document.getElementById('headerTimerWrap').style.display = 'none';
  updateHeaderSwitchesBadge();
  document.getElementById('btnFinishExam').disabled = false;
  document.getElementById('tabBtnRecap').classList.add('locked');
  document.getElementById('tabBtnRecap').title = t('recapLockedTab');
  document.getElementById('recapWrap').innerHTML = '<div class="recap-locked">' + t('recapLockedTab') + '</div>';
  renderDomainsTable();
  updateTimerDisplay();
  renderPalette();
  renderQuestion();
  switchTab('contexte');
}

/* =========================================================
   11. ONGLETS ET LANGUE
   ========================================================= */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===name); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='examen') startTimer();
}
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.classList.contains('locked')) return;
    switchTab(btn.dataset.tab);
  });
});
document.getElementById('btnGoExam').addEventListener('click', function(){ switchTab('examen'); });

function setLang(newLang){
  if(lang===newLang) return;
  lang = newLang;
  applyStaticStrings();
  renderPalette();
  // On rafraîchit la question et le récap même si leur onglet n'est pas actif à cet instant :
  // sinon, en changeant de langue depuis l'accueil, la question déjà rendue reste dans l'ancienne
  // langue jusqu'à la prochaine interaction (c'était le bug remonté : "la 1re question reste en FR").
  renderQuestion();
  if(state.finished){ renderRecap(state.timeUpFlag); }
}
document.getElementById('langFr').addEventListener('click', function(){ setLang('fr'); });
document.getElementById('langEn').addEventListener('click', function(){ setLang('en'); });

/* =========================================================
   12. INITIALISATION
   ========================================================= */
buildExam();
applyStaticStrings();
renderPalette();
renderQuestion();
updateTimerDisplay();

</script>
