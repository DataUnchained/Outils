<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraCRM · TerraCafé Pro</title>
<style>
:root{--bg:#f5f3ef;--panel:#fff;--ink:#2b2420;--mut:#7a6f66;--line:#e6e0d8;--brand:#6b3f22;--brand2:#a8693b;--acc:#2f7d6d;--warn:#b5502f;--chip:#f1ebe3;--sel:#fbf6ef}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#2b2420;color:#efe7dd;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:0 20px 18px;font-weight:700;font-size:18px;letter-spacing:.3px}
.logo small{display:block;font-weight:400;font-size:12px;color:#bfae9c}
nav a{display:flex;gap:10px;align-items:center;padding:9px 20px;color:#e3d8cb;text-decoration:none;border-left:3px solid transparent}
nav a:hover{background:#3a312b}
nav a.on{background:#3a312b;border-left-color:var(--brand2);color:#fff}
nav .sep{height:1px;background:#463b33;margin:10px 20px}
.user{padding:16px 20px;font-size:12px;color:#bfae9c}
main{padding:22px 28px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,button{font:inherit}
input[type=search],select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
input[type=search]{min-width:240px}
button{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.pri:hover{background:#5a341c}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tw{overflow:auto;max-height:calc(100vh - 210px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#faf8f5;font-weight:600;cursor:pointer;user-select:none;z-index:1}
th .a{color:var(--mut);font-size:11px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sel)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:#c0b5aa;font-style:italic}
.pager{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--chip);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{padding:14px 16px}
.box h3{margin:0 0 10px;font-size:14px}
.hb{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.hb .t{height:12px;background:var(--brand2);border-radius:3px}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow:auto;padding-bottom:10px}
.col{background:#ece6de;border-radius:10px;padding:8px;min-height:200px}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col h4 span{color:var(--mut);font-weight:400}
.col.weird{background:#f6e2d9}
.dc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:7px;font-size:12.5px;cursor:pointer}
.dc:hover{border-color:var(--brand2)}
.dc b{display:block;margin-bottom:3px}
.dc .m{display:flex;justify-content:space-between;color:var(--mut)}
.drawer{position:fixed;top:0;right:0;width:min(520px,100%);height:100vh;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:.2s;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.dh h2{margin:0;font-size:17px}
.db{padding:14px 20px;overflow:auto}
dl{display:grid;grid-template-columns:160px 1fr;gap:5px 10px;margin:0 0 16px;font-size:13px}
dt{color:var(--mut)}
dd{margin:0;word-break:break-word}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:4px}
.rel h4{margin:14px 0 6px;font-size:13px}
.rel table td,.rel table th{padding:5px 7px}
.rel tbody tr{cursor:default}
.exp{display:grid;grid-template-columns:330px 1fr;gap:16px}.exp>div{min-width:0}
.exp .box label{display:block;margin:6px 0}
.cols{columns:2;font-size:13px}
.cols label{margin:2px 0!important}
.preview{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre;overflow:auto;max-height:360px;background:#faf8f5;border:1px solid var(--line);border-radius:8px;padding:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2420;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}
.toast.show{opacity:1}
.help{max-width:900px}
.help h2{font-size:17px;margin:22px 0 8px}
.help table{background:#fff}
.help td{white-space:normal}
.muted{color:var(--mut)}
button.danger{color:var(--warn);border-color:#e7c3b5}
.imp{display:grid;grid-template-columns:340px 1fr;gap:16px}.imp>div{min-width:0}
.imp .box label{display:block;margin:6px 0}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:#faf8f5}
.drop.over,.drop:hover{border-color:var(--brand2);background:var(--sel)}
textarea{width:100%;font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:7px;padding:8px}
.ok{background:#eaf4f1;border-color:#bfdcd4;padding:10px 14px}
.box.err{background:#fbeee9;border-color:#ecc5b7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--chip);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--mut)}
.chip b{display:block;font-size:18px;color:var(--ink)}
.chip.e b{color:var(--warn)}.chip.w b{color:#b0841b}
.lv{font-size:11px;padding:1px 7px;border-radius:10px}.lv.err{background:#f6d8cc;color:#8c3418}.lv.warn{background:#f6ecc9;color:#7a5a07}
.qt{font-size:12.5px}.qt td,.qt th{padding:4px 8px}.qt tbody tr{cursor:default}
.qh{margin:12px 0 4px;font-size:13px}
.steps{padding-left:18px;line-height:1.8}
.warnbox{background:#fdf6e3;border:1px solid #efdfae;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:30}
.modal.open{display:flex}.modal>div{background:#fff;border-radius:12px;padding:20px;max-width:420px}
@media (max-width:900px){.imp{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.grid2,.exp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">☕ TerraCRM<small>TerraCafé Pro · Aix-en-Provence</small></div>
    <nav id="nav">
      <a href="#accueil" data-v="accueil">📊 Tableau de bord</a>
      <a href="#contacts" data-v="contacts">👤 Contacts</a>
      <a href="#entreprises" data-v="entreprises">🏢 Entreprises</a>
      <a href="#opportunites" data-v="opportunites">💼 Opportunités</a>
      <a href="#pipeline" data-v="pipeline">🧭 Pipeline</a>
      <a href="#activites" data-v="activites">📞 Activités</a>
      <div class="sep"></div>
      <a href="#exports" data-v="exports">⬇️ Exports</a>
      <a href="#import" data-v="import">⬆️ Import</a>
      <a href="#aide" data-v="aide">❓ Lisez-moi</a>
    </nav>
    <div class="user">Connecté : compte Formation<br>Base au 29/10/2026<br><br>Données 100 % fictives, usage pédagogique.</div>
  </aside>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer"><div class="dh"><div><div class="muted" id="dk"></div><h2 id="dt"></h2></div><button onclick="closeDrawer()">✕</button></div><div class="db" id="dbody"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div><p></p><div class="bar" style="justify-content:flex-end;margin:0"><button class="no">Annuler</button><button class="pri yes">Confirmer</button></div></div></div>

<script>
// TerraCRM : générateur déterministe de données fictives TerraCafé Pro
// Aucune donnée réelle : noms inventés, domaines .example, numéros de téléphone réservés à la fiction (ARCEP).
function generateTerraData() {
  let s = 20261030;
  const rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const chance = p => rnd() < p;
  const wpick = items => { let tot = items.reduce((x, y) => x + y[1], 0), r = rnd() * tot; for (const [v, w] of items) { if ((r -= w) < 0) return v; } return items[items.length - 1][0]; };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const hash = str => { let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };

  // ---------- Dates ----------
  const DAY = 86400000;
  const d = (y, m, dd) => Date.UTC(y, m - 1, dd);
  const add = (t, n) => t + n * DAY;
  const p2 = n => String(n).padStart(2, '0');
  const parts = t => { const x = new Date(t); return [x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()]; };
  const F = {
    fr: t => { const [y, m, dd] = parts(t); return `${p2(dd)}/${p2(m)}/${y}`; },
    iso: t => { const [y, m, dd] = parts(t); return `${y}-${p2(m)}-${p2(dd)}`; },
    fr2: t => { const [y, m, dd] = parts(t); return `${p2(dd)}/${p2(m)}/${String(y).slice(2)}`; },
    dash: t => { const [y, m, dd] = parts(t); return `${p2(dd)}-${p2(m)}-${y}`; },
    us: t => { const [y, m, dd] = parts(t); return `${p2(m)}/${p2(dd)}/${y}`; },
  };
  const TODAY = d(2026, 10, 30);
  const rdate = (a, b) => add(a, ri(0, Math.round((b - a) / DAY)));
  const month = t => parts(t)[1];

  // ---------- Référentiels ----------
  const OWNERS = [
    { code: 'JMA', nom: 'Julie Martin', deps: ['13', '84', '04', '05'], v: ['J. Martin', 'JMA', 'julie martin', 'Julie MARTIN'] },
    { code: 'KBE', nom: 'Karim Benali', deps: ['83', '06'], v: ['K. Benali', 'KBE', 'karim benali', 'Karim BENALI'] },
    { code: 'SLA', nom: 'Sophie Laurent', deps: ['34', '30'], v: ['S. Laurent', 'SLA', 'sophie laurent', 'Sophie LAURENT'] },
    { code: 'TRO', nom: 'Thomas Roux', deps: ['69', '38'], v: ['T. Roux', 'TRO', 'thomas roux', 'Thomas ROUX'] },
  ];
  const ownerOfDep = dep => OWNERS.find(o => o.deps.includes(dep));
  const ownerLabel = (o, pVar, pEmpty) => chance(pEmpty) ? '' : chance(pVar) ? pick(o.v) : o.nom;

  const CITIES = {
    '13': [['Marseille', '13008'], ['Marseille', '13002'], ['Aix-en-Provence', '13100'], ['Aix-en-Provence', '13290'], ['Aubagne', '13400'], ['Salon-de-Provence', '13300'], ['Martigues', '13500'], ['Vitrolles', '13127']],
    '84': [['Avignon', '84000'], ['Carpentras', '84200'], ['Orange', '84100'], ['Cavaillon', '84300']],
    '04': [['Manosque', '04100'], ['Digne-les-Bains', '04000']],
    '05': [['Gap', '05000'], ['Briançon', '05100']],
    '83': [['Toulon', '83000'], ['Fréjus', '83600'], ['Hyères', '83400'], ['Draguignan', '83300']],
    '06': [['Nice', '06000'], ['Nice', '06200'], ['Cannes', '06400'], ['Antibes', '06600'], ['Valbonne', '06560']],
    '34': [['Montpellier', '34000'], ['Montpellier', '34070'], ['Béziers', '34500'], ['Sète', '34200']],
    '30': [['Nîmes', '30000'], ['Alès', '30100']],
    '69': [['Lyon', '69003'], ['Lyon', '69007'], ['Villeurbanne', '69100'], ['Vénissieux', '69200']],
    '38': [['Grenoble', '38000'], ['Vienne', '38200'], ['Bourgoin-Jallieu', '38300']],
  };
  const DEP_W = [['13', 30], ['84', 8], ['04', 3], ['05', 2], ['83', 10], ['06', 12], ['34', 10], ['30', 5], ['69', 14], ['38', 6]];

  const CORES = ['Méridien', 'Calanque', 'Olivia', 'Lavande', 'Garrigue', 'Mistral', 'Rhône', 'Vauban', 'Cévennes', 'Alpilles', 'Ventoux', 'Phocée', 'Massalia', 'Durance', 'Estérel', 'Lubéron', 'Camargue', 'Belledonne', 'Vercors', 'Chartreuse', 'Fourvière', 'Lez', 'Aigoual', 'Verdon', 'Sainte-Victoire', 'Mercantour', 'Azur', 'Cigale', 'Restanque', 'Bastide', 'Tramontane', 'Pignon', 'Sextius', 'Canebière', 'Saint-Loup', 'Écrins', 'Dentelles', 'Caronte', 'Arlésienne', 'Port-Cros'];
  const SUFFIX = [['Conseil', 'Conseil & services aux entreprises'], ['Ingénierie', 'Industrie & ingénierie'], ['Logistique', 'Transport & logistique'], ['Immobilier', 'Immobilier'], ['Expertise', 'Expertise comptable & juridique'], ['Digital', 'Numérique & IT'], ['Santé', 'Santé & médico-social'], ['Industries', 'Industrie & ingénierie'], ['Services', 'Conseil & services aux entreprises'], ['Avocats', 'Expertise comptable & juridique'], ['Architectes', 'BTP & architecture'], ['Assurances', 'Banque & assurance'], ['Formation', 'Enseignement & formation'], ['Transport', 'Transport & logistique'], ['Énergies', 'Énergie & environnement'], ['Bâtiment', 'BTP & architecture'], ['Software', 'Numérique & IT'], ['Patrimoine', 'Banque & assurance']];
  const PREFIX = ['', '', '', 'Groupe ', 'Cabinet ', 'Atelier ', 'Clinique ', 'Agence '];
  const TRANCHES = ['1-9', '10-49', '50-249', '250+'];
  const TRANCHE_W = [[0, 15], [1, 45], [2, 30], [3, 10]];

  const PF = ['Camille', 'Laura', 'Émilie', 'Sarah', 'Claire', 'Manon', 'Pauline', 'Aurélie', 'Nathalie', 'Sandrine', 'Céline', 'Marion', 'Inès', 'Léa', 'Chloé', 'Élodie', 'Valérie', 'Isabelle', 'Audrey', 'Mélanie', 'Anaïs', 'Nadia', 'Sonia', 'Agnès', 'Hélène', 'Florence', 'Karine'];
  const PM = ['Nicolas', 'Julien', 'Mathieu', 'Romain', 'Sébastien', 'Antoine', 'Maxime', 'Guillaume', 'Pierre', 'Laurent', 'Frédéric', 'David', 'Mehdi', 'Yann', 'Stéphane', 'Benoît', 'Vincent', 'Damien', 'Arnaud', 'Cédric', 'Jérôme', 'Hugo', 'Lucas', 'Xavier', 'Rachid', 'Franck'];
  const NOMS = ['Bernard', 'Dubois', 'Moreau', 'Lefebvre', 'Garcia', 'Roussel', 'Fontaine', 'Chevalier', 'Girard', 'Bonnet', 'Mercier', 'Blanc', 'Guérin', 'Muller', 'Henry', 'André', 'Morel', 'Fournier', 'Lambert', 'Rousseau', 'Masson', 'Marchand', 'Duval', 'Denis', 'Dumont', 'Picard', 'Lemoine', 'Brun', 'Gauthier', 'Perrin', 'Robin', 'Clément', 'Morin', 'Hamidi', 'Mansouri', 'Rossi', 'Ferrari', 'Nguyen', 'Da Silva', 'Pereira', 'Barbier', 'Giraud', 'Aubert', 'Roche', 'Colin', 'Renaud', 'Leclerc', 'Vidal', 'Baron', 'Lacroix', 'Fabre', 'Carpentier', 'Bertin', 'Gilles', 'Ferrand', 'Albertini', 'Santoni', 'Benhamou', 'Chabert', 'Teyssier'];
  const POSTES = [['Office Manager', 18], ['Responsable RH', 12], ['DRH', 6], ['Assistante de direction', 12], ['Directeur général', 8], ['Responsable services généraux', 12], ['Gérant', 8], ['Responsable achats', 10], ['Chargée de communication', 4], ['Directeur administratif et financier', 6], ['Responsable QVT', 4]];

  const OFFERS = {
    'TCP-B10': { lib: 'Pack Bureau 10', lo: 2400, hi: 4800 },
    'TCP-B50': { lib: 'Pack Bureau 50', lo: 6000, hi: 12000 },
    'TCP-FGP': { lib: 'Fontaine à grains Premium', lo: 9000, hi: 18000 },
    'TCP-MNT': { lib: 'Contrat maintenance', lo: 900, hi: 2400 },
    'TCP-CAP': { lib: 'Capsules réassort annuel', lo: 1200, hi: 6000 },
    'TCP-EVT': { lib: 'Pack Événementiel', lo: 1500, hi: 5000 },
  };

  const SRC_VARIANTS = {
    'Recherche organique': ['SEO', 'Organique', 'recherche organique', 'Google (naturel)'],
    'Accès direct': ['Direct', 'Acces direct', 'accès direct'],
    'Google Ads': ['Google ads', 'google ads', 'Adwords', 'SEA'],
    'LinkedIn Ads': ['Linkedin Ads', 'LinkedIn ads', 'LKD Ads', 'Linkedin'],
    'LinkedIn organique': ['Linkedin organique', 'LinkedIn', 'Réseaux sociaux'],
    'Emailing': ['E-mailing', 'Newsletter', 'emailing', 'Emailing '],
    'Site référent': ['Site referent', 'Referral', 'Annuaire'],
    'Salon': ['salon', 'Salon ', 'Événement', 'Salon pro'],
    'Recommandation': ['Recommendation', 'Bouche à oreille', 'Parrainage', 'recommandation'],
    'Prospection sortante': ['Prospection', 'Phoning', 'Cold call', 'prospection sortante'],
  };
  const srcLabel = (src, p) => (src && chance(p)) ? pick(SRC_VARIANTS[src]) : src;

  const slug = str => str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, 'et').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const phone = () => {
    const mob = chance(0.6);
    const digits = (mob ? '063998' : '046571') + p2(ri(0, 99)) + p2(ri(0, 99));
    const f = wpick([['sp', 70], ['raw', 12], ['intl', 10], ['dot', 8]]);
    const g = digits.match(/../g);
    if (f === 'sp') return g.join(' ');
    if (f === 'raw') return digits;
    if (f === 'dot') return g.join('.');
    return '+33 ' + digits.slice(1, 2) + ' ' + digits.slice(2).match(/../g).join(' ');
  };

  // ---------- Entreprises ----------
  const entreprises = [];
  const used = new Set();
  for (let i = 1; i <= 130; i++) {
    let name, sect;
    do {
      const [suf, sec] = pick(SUFFIX);
      const pre = pick(PREFIX);
      name = pre + pick(CORES) + ' ' + suf;
      if (pre === 'Clinique ') { name = 'Clinique ' + pick(CORES); }
      sect = pre === 'Clinique ' ? 'Santé & médico-social' : pre === 'Cabinet ' && sec.startsWith('Industrie') ? 'Conseil & services aux entreprises' : sec;
    } while (used.has(name));
    used.add(name);
    const dep = wpick(DEP_W);
    const [ville, cp] = pick(CITIES[dep]);
    const o = ownerOfDep(dep);
    const tr = wpick(TRANCHE_W);
    entreprises.push({
      _i: i, _tr: tr, _dep: dep, _owner: o, _name: name,
      id_entreprise: 'ENT-' + String(i).padStart(4, '0'),
      raison_sociale: name,
      secteur: sect,
      tranche_effectif: TRANCHES[tr],
      code_postal: cp,
      ville: chance(0.06) ? pick([ville.toUpperCase(), ville.replace(/-/g, ' '), ville.toLowerCase()]) : ville,
      departement: dep,
      proprietaire: ownerLabel(o, 0.05, 0.02),
      statut_compte: 'Prospect',
      date_creation: '',
    });
  }

  // ---------- Contacts ----------
  const contactsCore = [];
  const compOrder = [];
  entreprises.forEach(e => compOrder.push(e));
  for (let k = 0; k < 110; k++) compOrder.push(pick(entreprises));
  shuffle(compOrder);

  const SALON_MRS = { camp: 'Salon_Bureaux_Expo_Marseille', a: d(2026, 3, 17), b: d(2026, 3, 24) };
  const SALON_LYS = { camp: 'Salon_RH_Sud_Lyon', a: d(2026, 6, 10), b: d(2026, 6, 16) };
  const usedNames = new Set();

  compOrder.forEach((e, idx) => {
    const legacy = chance(0.12);
    let t = legacy ? rdate(d(2025, 3, 1), d(2025, 12, 31)) : rdate(d(2026, 1, 2), d(2026, 10, 28));
    let src, camp = '';
    if (legacy) {
      src = wpick([['Recherche organique', 25], ['Accès direct', 10], ['Recommandation', 25], ['Prospection sortante', 30], ['Emailing', 10]]);
      if (src === 'Emailing') camp = 'NL_mensuelle';
    } else {
      src = wpick([['Recherche organique', 16], ['Accès direct', 8], ['Google Ads', 14], ['LinkedIn Ads', 12], ['LinkedIn organique', 7], ['Emailing', 9], ['Site référent', 5], ['Salon', 8], ['Recommandation', 9], ['Prospection sortante', 12]]);
      if (src === 'Google Ads') camp = chance(0.65) ? 'SEA_machines_bureau' : 'SEA_capsules_pro';

    const second = !!c0._second;

let XLSXlib = null;
function loadXLSX() {

    s.onerror = () => rej(new Error('lib'));

async function saveFile(filename, data) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Fichier enregistré : ' + filename); }
    catch (e) { toast(e && e.code === 'declined' ? 'Téléchargement annulé' : 'Téléchargement impossible ici : utilisez « Copier »'); }
    return;
  }
  // Fichier ouvert hors claude.ai (ex. en local) : téléchargement classique
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Téléchargement lancé : ' + filename);
}
async function doDownload() {
  const { rows, cols } = exportRows();

  if (!cols.length) return toast('Sélectionnez au moins une colonne');

    catch (e) { return toast('Module Excel indisponible : choisissez CSV'); }
  }
  const csv = toCSV(rows, cols, EX.fmt === 'csv_sc' ? ';' : ',');
  saveFile(fn, new Blob([(EX.bom ? '﻿' : '') + csv], { type: 'text/csv' }));
}
async function doFull() {

}

function parseDelimited(text) {

    else if (ch === '"' && cur === '') q = true;

    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return { rows: rows.filter(r => r.some(c => c !== '')), sep };
}

  for (let r = R.s.r; r <= R.e.r; r++) {
    const row = [];
    for (let c = R.s.c; c <= R.e.c; c++) {

      if (!cell || cell.v == null) { row.push(''); continue; }
      if (cell.t === 'n' && cell.z && X.SSF.is_date(cell.z)) { const p = X.SSF.parse_date_code(cell.v); row.push(`${String(p.d).padStart(2, '0')}/${String(p.m).padStart(2, '0')}/${p.y}`); }
      else if (cell.t === 'd') { const d = cell.v; row.push(`${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`); }

// ---------- État de l'écran d'import ----------

const normH = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

function analyze() {

      });
      if (refused) R.partial = (R.partial || 0) + 1, R.refusedFields = (R.refusedFields || 0) + refused;
      if (Object.keys(changes).length) { R.update.push({ id, changes, before: Object.fromEntries(Object.keys(changes).map(f => [f, old[f]])) }); okRecs.push({ line, rec: { ...old, ...changes } }); }
      else { R.unchanged++; okRecs.push({ line, rec: { ...old, ...changes } }); }
      return;
    }
    if (mode === 'update' && !IM.createNew) { P({ lvl: 'err', rule: 'ID inconnu', msg: 'cochez « Créer les nouveaux ID » pour l\'ajouter', field: key, value: id }); R.rejected++; return; }
    // création (mode mise à jour) ou remplacement complet : contrôle complet
    const { norm, iss } = validateFull(k, rec); iss.forEach(P);
    if (errs) { R.rejected++; return; }
    if (mode === 'replace') okRecs.push({ line, rec: norm });
    else { R.create.push(norm); okRecs.push({ line, rec: norm }); }
  });
  // Doublons : dans le fichier (remplacement) ou fichier + base (mise à jour)
  if (mode !== 'delete') {
    const pool = mode === 'replace' ? okRecs.map(o => o.rec) : [...D[k].filter(r => !okRecs.some(o => o.rec[key] === r[key])), ...okRecs.map(o => o.rec)];
    const offset = mode === 'replace' ? 0 : pool.length - okRecs.length;
    dupChecks(k, pool).forEach(d => { if (d.i >= offset) { const o = okRecs[d.i - offset]; push(o.line, o.rec[key], { ...d, lvl: mode === 'replace' ? 'err' : 'warn', field: '' }); } });
  }
  if (mode === 'replace') {
    const ids = new Set(okRecs.map(o => o.rec[key]));
    D[k].filter(r => !seen.has(r[key])).forEach(r => { const ch = childrenOf(k, r[key]); if (ch.length) R.issues.push({ line: '-', id: r[key], field: key, value: '', lvl: 'err', rule: 'Suppression impossible : enregistrements liés', msg: `absent du fichier mais ${ch.length} lié(s) : ${ch.slice(0, 3).join(', ')}` }); });
    const nErr = R.issues.filter(x => x.lvl === 'err').length;
    R.replace = { n: okRecs.length, removed: D[k].filter(r => !ids.has(r[key])).length, blocked: nErr > 0 };
    if (nErr) R.rejected = new Set(R.issues.filter(x => x.lvl === 'err').map(x => x.id)).size;
  }
  return (IM.report = R);
}
function applyImport() {
  const k = IM.obj, R = IM.report, key = OBJ[k].key; if (!R) return;
  let summary;
  if (IM.mode === 'delete') { const s = new Set(R.del); D[k] = D[k].filter(r => !s.has(r[key])); summary = { supprimes: R.del.length }; }
  else if (IM.mode === 'replace') {
    if (R.replace.blocked) return;
    const rows = IM.rows.map(row => { const o = {}; Object.entries(IM.map).forEach(([i, f]) => { if (f) o[f] = row[i] ?? ''; }); return validateFull(k, o).norm; });
    summary = { remplaces: rows.length, supprimes: R.replace.removed }; D[k] = rows;
  } else {
    R.update.forEach(u => { const r = D[k].find(x => x[key] === u.id); Object.assign(r, u.changes); });
    R.create.forEach(n => D[k].push(n));
    summary = { crees: R.create.length, mis_a_jour: R.update.length };
  }
  const diff = [];
  if (IM.mode === 'update') R.update.forEach(u => Object.keys(u.changes).forEach(f => diff.push({ id: u.id, f, a: u.before[f], b: u.changes[f] })));
  R.create.forEach(n => diff.push({ id: n[key], f: '(nouvelle fiche)', a: '', b: '' }));
  if (IM.mode === 'delete') R.del.forEach(id => diff.push({ id, f: '(fiche supprimée)', a: '', b: '' }));
  const p2 = n => String(n).padStart(2, '0'); const now = new Date();
  IMPORT_LOG.unshift({ quand: `${p2(now.getDate())}/${p2(now.getMonth() + 1)}/${now.getFullYear()} ${p2(now.getHours())}:${p2(now.getMinutes())}`, objet: OBJ[k].label, mode: MODES[IM.mode].l, fichier: IM.file || 'collage', ...summary, rejetes: R.rejected });
  QUALITY_CACHE = null;
  const ok = saveState();
  IM.done = { summary, ok, diff, obj: k }; IM.report = null; IM.header = []; IM.rows = []; IM.file = null; IM.sheets = null; IM.wb = null;
  toast(ok ? 'Import appliqué et enregistré' : 'Import appliqué (non enregistré : stockage indisponible)');
  render(); window.scrollTo(0, 0);
}

// ---------- Écran ----------
const MODES = {
  update: { l: 'Mise à jour par ID', d: 'Met à jour les enregistrements existants à partir de leur ID. Seules les colonnes associées sont modifiées.' },
  replace: { l: 'Remplacement complet', d: 'Le fichier devient la nouvelle table. Les ID absents du fichier sont supprimés. Import refusé s\'il reste une seule erreur.' },
  delete: { l: 'Suppression', d: 'Supprime les ID listés dans le fichier (seule la colonne ID est utilisée). Impossible si des enregistrements y sont liés.' },
};
function viewImport() {
  const k = IM.obj, R = IM.report, L = FIELD_LABEL(k);
  const q = qualityReport();
  const tot = Object.values(q).reduce((a, x) => a + x.rules.filter(r => r.lvl === 'err').reduce((s, r) => s + r.n, 0), 0);
  let h = `<h1>Import</h1><p class="sub">Réinjecter des données corrigées dans le CRM. Le CRM contrôle chaque ligne comme le ferait un vrai outil.</p>`;
  if (IM.done) {
    const df = IM.done.diff || [];
    h += `<div class="card box ok">✅ <b>Import appliqué dans la base ${OBJ[IM.done.obj].label}</b> : ${Object.entries(IM.done.summary).filter(([, b]) => b).map(([a, b]) => `${b} ${SUM_L[a]}`).join(', ') || 'aucune modification'}.${IM.done.ok ? ' Base enregistrée dans ce navigateur.' : ' <b>Attention : ce navigateur refuse l\'enregistrement, les modifications seront perdues si la page est rechargée.</b>'}
    ${df.length ? `<details ${df.length <= 30 ? 'open' : ''} style="margin-top:8px"><summary>Voir les ${df.length} modification(s)</summary><div class="tw" style="max-height:280px;margin-top:6px"><table class="qt"><thead><tr><th>ID</th><th>Champ</th><th>Avant</th><th>Après</th></tr></thead><tbody>${df.slice(0, 500).map(d => `<tr><td><a href="#" data-open="${esc(d.id)}">${esc(d.id)}</a></td><td>${esc(d.f)}</td><td>${cell(d.a)}</td><td><b>${cell(d.b)}</b></td></tr>`).join('')}</tbody></table></div></details>` : '<p class="note">Aucune valeur n\'a changé : les données importées étaient identiques à celles de la base.</p>'}</div>`;
  }
  h += `<div class="imp"><div class="card box">
   <h3>1. Objet à importer</h3>${Object.keys(OBJ).map(o => `<label><input type="radio" name="iobj" value="${o}" ${k === o ? 'checked' : ''}> ${OBJ[o].label}</label>`).join('')}
   <h3 style="margin-top:14px">2. Mode</h3>${Object.entries(MODES).map(([m, x]) => `<label title="${esc(x.d)}"><input type="radio" name="imode" value="${m}" ${IM.mode === m ? 'checked' : ''}> ${x.l}</label>`).join('')}
   <p class="note" style="margin-top:4px">${esc(MODES[IM.mode].d)}</p>
   ${IM.mode === 'update' ? `<label><input type="checkbox" id="inew" ${IM.createNew ? 'checked' : ''}> Créer les nouveaux ID</label><label><input type="checkbox" id="iempty" ${IM.ignoreEmpty ? 'checked' : ''}> Ignorer les cellules vides (ne pas effacer)</label>` : ''}
   <h3 style="margin-top:14px">3. Fichier</h3>
   <label class="drop" id="drop"><input type="file" id="ifile" accept=".csv,.txt,.xlsx,.xls" hidden><b>Déposer un fichier ici</b><br><span class="muted">ou cliquer pour choisir · CSV (; , tabulation), XLSX</span></label>
   <details style="margin-top:8px"><summary class="muted">… ou coller depuis Excel</summary><textarea id="ipaste" rows="5" placeholder="Copiez la plage avec la ligne d'en-têtes puis collez ici"></textarea><button id="ipastego" style="margin-top:6px">Utiliser le collage</button></details>
   ${IM.header.length ? `<p class="note">📄 <b>${esc(IM.file || 'Collage')}</b> · ${esc(IM.info)} · ${IM.rows.length} ligne(s)</p>` : ''}
   ${IM.sheets && IM.sheets.length > 1 ? `<label>Onglet : <select id="isheet">${IM.sheets.map(s => `<option ${s === IM.sheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>` : ''}
  </div>
  <div class="card box">${IM.header.length ? `<h3>4. Correspondance des colonnes</h3>
   <div class="tw" style="max-height:340px"><table><thead><tr><th>Colonne du fichier</th><th>Exemple</th><th>Champ TerraCRM</th></tr></thead><tbody>
   ${IM.header.map((hd, i) => `<tr><td>${esc(hd) || '<span class="empty">(sans titre)</span>'}</td><td class="muted">${esc(String(IM.rows[0]?.[i] ?? '')).slice(0, 40)}</td><td><select data-map="${i}"><option value="">Ne pas importer</option>${OBJ[k].cols.map(([c, l]) => `<option value="${c}" ${IM.map[i] === c ? 'selected' : ''}>${c}${SPEC[k][c]?.req ? ' *' : ''}</option>`).join('')}</select></td></tr>`).join('')}
   </tbody></table></div><p class="note">* champ obligatoire. Les noms de colonnes des exports TerraCRM sont reconnus automatiquement.</p>
   <div class="bar"><button class="pri" id="ianalyze">🔍 Analyser le fichier</button></div>` : `<h3>Comment ça marche</h3><ol class="steps"><li>Exportez un objet depuis le menu <b>Exports</b>.</li><li>Nettoyez-le dans Excel ou Power Query sans toucher aux ID.</li><li>Réimportez-le ici : le CRM vérifie chaque ligne et refuse ce qui n'est pas conforme.</li><li>Corrigez les rejets et recommencez jusqu'à un rapport sans erreur.</li></ol>
   <p class="note">Formats acceptés : dates jj/mm/aaaa ou aaaa-mm-jj, montants numériques sans symbole, valeurs de liste exactement comme dans le Lisez-moi, pas d'espaces parasites.</p>`}</div></div>`;
  if (R) h += viewReport(R, L);
  h += `<div class="grid2" style="margin-top:14px"><div class="card box"><h3>Qualité de la base actuelle</h3><p class="note" style="margin-top:0">${tot ? `<b>${fmtN(tot)} erreur(s)</b> détectée(s) par les contrôles du CRM.` : '✅ Aucune erreur bloquante détectée.'}</p>
   ${Object.keys(OBJ).map(o => `<h4 class="qh">${OBJ[o].label} <span class="muted">(${q[o].recs} fiche(s) concernée(s) sur ${D[o].length})</span></h4>${q[o].rules.length ? `<table class="qt"><tbody>${q[o].rules.map(r => `<tr><td><span class="lv ${r.lvl}">${r.lvl === 'err' ? 'Erreur' : 'Alerte'}</span></td><td>${esc(r.rule)}</td><td class="num">${r.n}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">RAS</p>'}`).join('')}
  </div><div class="card box"><h3>Historique des imports</h3>${IMPORT_LOG.length ? `<table class="qt"><thead><tr><th>Quand</th><th>Objet</th><th>Mode</th><th>Fichier</th><th>Résultat</th></tr></thead><tbody>${IMPORT_LOG.map(l => `<tr><td>${l.quand}</td><td>${l.objet}</td><td>${l.mode}</td><td>${esc(l.fichier)}</td><td>${['crees', 'mis_a_jour', 'remplaces', 'supprimes', 'rejetes'].filter(x => l[x]).map(x => `${l[x]} ${SUM_L[x]}`).join(', ') || 'aucune modification'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aucun import pour l\'instant.</p>'}
   <div class="bar" style="margin-top:12px"><button id="ireset" class="danger">↺ Réinitialiser la base d'origine</button></div><p class="note">Les modifications sont enregistrées dans ce navigateur uniquement.</p></div></div>`;
  return h;
}
function viewReport(R, L) {
  if (R.global.length) return `<div class="card box err" style="margin-top:14px"><h3>Import impossible</h3><ul>${R.global.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>`;
  const nE = R.issues.filter(x => x.lvl === 'err').length, nW = R.issues.length - nE;
  const list = R.issues.filter(x => IM.filter === 'all' || x.lvl === IM.filter);
  let chips;
  if (IM.mode === 'delete') chips = [['À supprimer', R.del.length], ['Rejetées', R.rejected]];
  else if (IM.mode === 'replace') chips = [['Lignes valides', R.replace.n - (R.replace.blocked ? R.rejected : 0)], ['Fiches supprimées', R.replace.removed], ['Lignes en erreur', R.rejected]];
  else chips = [['À créer', R.create.length], ['Fiches à modifier', R.update.length], ['Inchangées', R.unchanged], ['Lignes rejetées', R.rejected], ['Champs refusés', R.refusedFields || 0]];
  const canApply = IM.mode === 'replace' ? !R.replace.blocked : (R.create.length + R.update.length + R.del.length) > 0;
  const nChg = R.update.reduce((a, u) => a + Object.keys(u.changes).length, 0);
  const applyBtn = `<button class="pri" id="iapply" ${canApply ? '' : 'disabled'}>✔ Appliquer l'import${IM.mode === 'replace' ? ' (remplacer la table)' : IM.mode === 'update' ? ` · ${R.update.length + R.create.length} fiche(s), ${nChg} valeur(s)` : ''}</button>`;
  return `<div class="card box" style="margin-top:14px" id="report"><h3>5. Rapport d'analyse · ${R.lines} ligne(s)</h3>
   <div class="warnbox">${canApply ? `⚠️ <b>Rien n'est encore modifié.</b> Vérifiez le rapport puis cliquez sur « Appliquer l'import ».` : IM.mode === 'update' ? `ℹ️ <b>Aucune valeur à modifier.</b> Les données du fichier sont identiques à la base, ou leurs champs ont tous été refusés (voir le détail).` : `ℹ️ Import impossible en l'état : corrigez les erreurs ci-dessous.`}</div>
   <div class="bar">${applyBtn}</div>
   <div class="chips">${chips.map(([l, n]) => `<div class="chip"><b>${fmtN(n)}</b>${l}</div>`).join('')}<div class="chip e"><b>${nE}</b>erreur(s)</div><div class="chip w"><b>${nW}</b>alerte(s)</div></div>
   ${IM.mode === 'replace' && R.replace.blocked ? '<p class="note"><b>Remplacement bloqué :</b> corrigez toutes les erreurs avant de pouvoir remplacer la table.</p>' : ''}
   ${R.issues.length ? `<div class="bar"><select id="ifilter"><option value="all" ${IM.filter === 'all' ? 'selected' : ''}>Tout afficher</option><option value="err" ${IM.filter === 'err' ? 'selected' : ''}>Erreurs (ligne rejetée)</option><option value="warn" ${IM.filter === 'warn' ? 'selected' : ''}>Alertes (ligne importée)</option></select><button id="icopy">📋 Copier le rapport</button></div>
   <div class="tw" style="max-height:360px"><table><thead><tr><th>Ligne</th><th>ID</th><th>Niveau</th><th>Contrôle</th><th>Champ</th><th>Valeur</th><th>Détail</th></tr></thead><tbody>
   ${list.slice(0, 500).map(x => `<tr><td>${x.line}</td><td>${esc(x.id)}</td><td><span class="lv ${x.lvl}">${x.lvl === 'err' ? 'Erreur' : 'Alerte'}</span></td><td>${esc(x.rule)}</td><td>${esc(x.field)}</td><td>${cell(x.value)}</td><td>${esc(x.msg)}</td></tr>`).join('')}
   </tbody></table></div>${list.length > 500 ? `<p class="note">500 premières lignes affichées sur ${list.length}. Utilisez « Copier le rapport » pour tout récupérer.</p>` : ''}` : '<p>✅ Aucune anomalie détectée.</p>'}
   ${IM.mode === 'update' && (R.rejected || R.refusedFields) ? `<p class="note">Les lignes rejetées (ID inconnu ou en double) et les champs refusés ne seront pas importés ; les autres champs valides de chaque ligne le seront.</p>` : ''}
   ${R.rejected && IM.mode === 'delete' ? `<p class="note">Les ${R.rejected} ligne(s) rejetée(s) seront ignorées.</p>` : ''}</div>`;
}
function bindImport() {
  document.querySelectorAll('input[name=iobj]').forEach(el => el.onchange = () => { IM.obj = el.value; if (IM.wb && IM.sheets) { const g = IM.sheets.find(n => normH(n) === normH(OBJ[IM.obj].label)); if (g) { IM.sheet = g; loadXLSX().then(X => { setTable(sheetToRows(X, IM.wb.Sheets[g]), `Excel · onglet « ${g} »`); render(); }); return; } } if (IM.header.length) autoMap(); IM.report = null; render(); });
  document.querySelectorAll('input[name=imode]').forEach(el => el.onchange = () => { IM.mode = el.value; IM.report = null; render(); });
  const n = document.getElementById('inew'); if (n) n.onchange = () => { IM.createNew = n.checked; IM.report = null; render(); };
  const e = document.getElementById('iempty'); if (e) e.onchange = () => { IM.ignoreEmpty = e.checked; IM.report = null; render(); };
  const f = document.getElementById('ifile'); f.onchange = () => f.files[0] && handleFile(f.files[0]);
  const drop = document.getElementById('drop');
  drop.ondragover = ev => { ev.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = ev => { ev.preventDefault(); drop.classList.remove('over'); const fl = ev.dataTransfer.files[0]; if (fl) handleFile(fl); };
  document.getElementById('ipastego').onclick = () => { const t = document.getElementById('ipaste').value; if (!t.trim()) return toast('Rien à importer'); IM.file = 'Collage'; IM.sheets = null; IM.wb = null; const { rows } = parseDelimited(t); setTable(rows, 'Collage depuis le presse-papiers'); render(); };
  const sh = document.getElementById('isheet'); if (sh) sh.onchange = async () => { IM.sheet = sh.value; const X = await loadXLSX(); setTable(sheetToRows(X, IM.wb.Sheets[sh.value]), `Excel · onglet « ${sh.value} »`); render(); };
  document.querySelectorAll('select[data-map]').forEach(s => s.onchange = () => { IM.map[s.dataset.map] = s.value; IM.report = null; });
  const a = document.getElementById('ianalyze'); if (a) a.onclick = () => { analyze(); IM.done = null; IM.filter = 'all'; render(); document.getElementById('report')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  document.querySelectorAll('a[data-open]').forEach(a => a.onclick = ev => { ev.preventDefault(); openRecord(IM.done.obj, a.dataset.open); });
  const fl = document.getElementById('ifilter'); if (fl) fl.onchange = () => { IM.filter = fl.value; render(); };
  const cp = document.getElementById('icopy'); if (cp) cp.onclick = async () => {
    const R = IM.report; const t = ['ligne\tid\tniveau\tcontrole\tchamp\tvaleur\tdetail', ...R.issues.map(x => [x.line, x.id, x.lvl === 'err' ? 'Erreur' : 'Alerte', x.rule, x.field, x.value, x.msg].join('\t'))].join('\n');
    try { await navigator.clipboard.writeText(t); toast(`${R.issues.length} anomalie(s) copiée(s)`); } catch (e) { toast('Copie refusée par le navigateur'); }
  };
  const ap = document.getElementById('iapply'); if (ap) ap.onclick = () => IM.mode === 'update' ? applyImport() : askConfirm(IM.mode === 'replace' ? `Remplacer toute la table ${OBJ[IM.obj].label} par le fichier (${IM.report.replace.removed} fiche(s) supprimée(s)) ?` : `Supprimer définitivement ${IM.report.del.length} fiche(s) ${OBJ[IM.obj].label} ?`, applyImport);
  document.getElementById('ireset').onclick = () => askConfirm('Revenir à la base d\'origine ? Tous les imports seront perdus.', () => { resetState(); IM.report = null; IM.done = null; toast('Base d\'origine restaurée'); render(); });
}
function askConfirm(msg, fn) {
  const m = document.getElementById('modal');
  m.querySelector('p').textContent = msg; m.classList.add('open');
  m.querySelector('.yes').onclick = () => { m.classList.remove('open'); fn(); };
  m.querySelector('.no').onclick = () => m.classList.remove('open');
}

loadState();
// ---------- Routeur ----------
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
function render() {
  const v = (location.hash || '#accueil').slice(1);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  const m = document.getElementById('main');
  if (OBJ[v]) { m.innerHTML = viewList(v); bindList(v); }
  else if (v === 'pipeline') { m.innerHTML = viewPipeline(); document.getElementById('po').onchange = e => { pipeOwner = e.target.value; render(); }; document.querySelectorAll('.dc').forEach(c => c.onclick = () => openRecord('opportunites', c.dataset.id)); }
  else if (v === 'exports') { m.innerHTML = viewExports(); bindExports(); }
  else if (v === 'import') { m.innerHTML = viewImport(); bindImport(); }
  else if (v === 'aide') m.innerHTML = viewHelp();
  else m.innerHTML = viewHome();
}
window.addEventListener('hashchange', () => { closeDrawer(); render(); });
render();
</script>
